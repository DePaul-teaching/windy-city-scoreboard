name: CI

on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
      contents: read
      packages: write


jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scoreboard/scoreboard-api/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scoreboard/scoreboard-api/requirements-dev.txt

      - name: Run tests
        run: |
          pytest -v

  build-and-push:
    name: Build and push image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker buildx build \
            --build-arg BUILD_SHA=${{ github.sha }} \
            --tag ghcr.io/${{ github.repository }}/scoreboard-api:${{ github.sha }} \
            --tag ghcr.io/${{ github.repository }}/scoreboard-api:latest \
            --push \
            scoreboard/scoreboard-api

